        <h1 class="title">3D Printing Education and Exploration</h1>
        <nav>

            <label for="sidebar-active" class="open-sidebar-button">
              <svg xmlns="http://www.w3.org/2000/svg" height="32" viewBox="0 -960 960 960" width="32"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/></svg>

                <svg xmlns="http://www.w3.org/2000/svg" height="32" viewBox="0 -960 960 960" width="32"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>

    </header>
    <main>
        <section class="card">
            <h1 class="header">
                Ask for help
            </h1>
            <div class="body">
                <div class="topic-container">
                    <div class="topic">
                        <form id="requestForm">
                            <div class="form-group">
                                <label for="userEmail">Your Email (will be hidden)</label>
                                <input type="email" id="userEmail" required name="userEmail">
                            </div>
                            <div class="form-group">
                                <label for="userName">Your Name</label>
                                <input type="text" id="userName" required name="userName">
                            </div>
                            <div class="form-group">
                                <label for="printer">Printer Name</label>
                                <input type="text"  list="printersList" name="printer" id="printer" required>
                                <datalist id="printersList">
                                    <option value="Bambu X1C">
                                    <option value="Bambu P1S">
                                    <option value="Bambu A1">
                                    <option value="Elegoo Saturn">
                                    <option value="Elegoo Mars">
                                    <option value="Prusa MKS">
                                </datalist>
                            </div>
                            <div class="form-group">
                                <label for="writtenRequest">Current Issue:</label>
                                <textarea id="writtenRequest" name="writtenRequest"></textarea>
                            </div>
                            <div class="form-group">
                                <input type="submit" value="Post Request for Help">
                            </div>
                        </form>                    
                    </div>
                </div>
            </div>
        </section>
        <section class="card">
            <h1 class="header">
                Requests for help
            </h1>
            <div class="body">
                <ul id="requestList">
                    
                </ul>
            </div>
        </section>
    </main>
