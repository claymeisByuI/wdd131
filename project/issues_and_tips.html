<header>
    <h1 class="title">3D Printing Education and Exploration</h1>
    <nav>
        <input id="sidebar-active" type="checkbox">
        <label class="open-sidebar-button" for="sidebar-active">
            <svg height="32" viewBox="0 -960 960 960" width="32" xmlns="http://www.w3.org/2000/svg">
                <path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/>
            </svg>
        </label>
        <label for="sidebar-active" id="overlay"></label>
        <div class="links-container">
            <label class="close-sidebar-button" for="sidebar-active">
                <svg height="32" viewBox="0 -960 960 960" width="32" xmlns="http://www.w3.org/2000/svg">
                    <path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/>

            <a class="home-link" href="index.html">Home</a>
            <a class="" href="printers.html">Printers</a>

        </div>
    </nav>
</header>
<main>
    <section class="card">
        <h1 class="header">
            Ask for help
        </h1>
        <div class="body">
            <div class="topic-container">
                <div class="topic">
                    <form id="requestForm">
                        <div class="form-group">
                            <label for="userEmail">Your Email (will be hidden)</label>
                            <input id="userEmail" name="userEmail" required type="email">
                        </div>
                        <div class="form-group">
                            <label for="userName">Your Name</label>
                            <input id="userName" name="userName" required type="text">
                        </div>
                        <div class="form-group">
                            <label for="printer">Printer Name</label>
                            <input id="printer" list="printersList" name="printer" required type="text">
                            <datalist id="printersList">
                                <option value="Bambu X1C">
                                <option value="Bambu P1S">
                                <option value="Bambu A1">
                                <option value="Elegoo Saturn">
                                <option value="Elegoo Mars">
                                <option value="Prusa MKS">
                            </datalist>
                        </div>
                        <div class="form-group">
                            <label for="writtenRequest">Current Issue:</label>
                            <textarea id="writtenRequest" name="writtenRequest"></textarea>
                        </div>
                        <div class="form-group">
                            <input type="submit" value="Post Request for Help">
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
    <section class="card">
        <h1 class="header">
            Requests for help
        </h1>
        <div class="body">
            <ul id="requestList">

            </ul>
        </div>
    </section>
</main>
